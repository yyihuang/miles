name: Upload snapshot records
description: Upload the snapshot record directory of one CI job as an artifact named after its suite and partition

inputs:
  execute_command:
    description: The command the job ran; its --suite and --auto-partition-id name the artifact
    required: true
  path:
    description: The record directory the harness wrote into
    required: true

runs:
  using: composite
  steps:
    - name: Name the snapshot record artifact
      id: name
      shell: bash
      env:
        EXECUTE_COMMAND: ${{ inputs.execute_command }}
      run: |
        suite=$(echo "$EXECUTE_COMMAND" | grep -oP -- '--suite\s+\K\S+' || true)
        partition=$(echo "$EXECUTE_COMMAND" | grep -oP -- '--auto-partition-id\s+\K\S+' || true)
        digest=$(echo -n "$EXECUTE_COMMAND" | sha1sum | cut -c1-8)
        echo "name=snapshot-records-${suite:-command-$digest}${partition:+-p$partition}" >> "$GITHUB_OUTPUT"

    - name: Upload snapshot records
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.name.outputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ignore
        retention-days: 14
